id = "symfony"
label = "symfony"

[start]
command = "symfony"
args = ["server:start", "--no-tls", "--port", "{port}"]

[env]
TRUSTED_PROXIES = "127.0.0.1,::1"

[lifecycle]
kind = "native"
ready_attempts = 8

[caddy]
profile = "proxy"

[hooks]
sync_php_version = true

[doctor]
binaries = ["symfony"]
marker_files = ["composer.json"]

[discovery]
command_contains = ["php", "symfony"]
