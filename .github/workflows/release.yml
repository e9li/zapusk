name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY: zapusk

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          pkg="${BINARY}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$pkg"
          cp "target/${{ matrix.target }}/release/$BINARY" "dist/$pkg/"
          cp README.md LICENSE.md "dist/$pkg/"
          tar -C dist -czvf "$pkg.tar.gz" "$pkg"
          shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-${{ matrix.target }}
          path: "*.tar.gz*"

  publish-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io (skips if version already published)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if curl -sf "https://crates.io/api/v1/crates/zapusk/$version" > /dev/null; then
            echo "zapusk $version already on crates.io, skipping"
          else
            cargo publish
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: pkg-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz*"
          generate_release_notes: true

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: pkg-*
          merge-multiple: true

      - name: Compute checksums
        id: sums
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            sum=$(cut -d' ' -f1 "${BINARY}-${GITHUB_REF_NAME}-${target}.tar.gz.sha256")
            key=$(echo "$target" | tr '-' '_')
            echo "sha_$key=$sum" >> "$GITHUB_OUTPUT"
          done

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.sums.outputs.version }}
          SHA_ARM: ${{ steps.sums.outputs.sha_aarch64_apple_darwin }}
          SHA_INTEL: ${{ steps.sums.outputs.sha_x86_64_apple_darwin }}
          SHA_LINUX: ${{ steps.sums.outputs.sha_x86_64_unknown_linux_gnu }}
          SHA_LINUX_ARM: ${{ steps.sums.outputs.sha_aarch64_unknown_linux_gnu }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/e9li/homebrew-tap.git" tap
          cd tap
          cat > Formula/zapusk.rb <<EOF
          class Zapusk < Formula
            desc "TUI for managing local web development projects"
            homepage "https://git.e9li.com/e9li/zapusk"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/e9li/zapusk/releases/download/v$VERSION/zapusk-v$VERSION-aarch64-apple-darwin.tar.gz"
                sha256 "$SHA_ARM"
              else
                url "https://github.com/e9li/zapusk/releases/download/v$VERSION/zapusk-v$VERSION-x86_64-apple-darwin.tar.gz"
                sha256 "$SHA_INTEL"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/e9li/zapusk/releases/download/v$VERSION/zapusk-v$VERSION-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$SHA_LINUX_ARM"
              else
                url "https://github.com/e9li/zapusk/releases/download/v$VERSION/zapusk-v$VERSION-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$SHA_LINUX"
              end
            end

            def install
              bin.install "zapusk"
              generate_completions_from_executable(bin/"zapusk", "completions")
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/zapusk --version")
            end
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/zapusk.rb
          git commit -m "zapusk $VERSION"
          git push
