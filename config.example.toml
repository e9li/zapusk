# zapusk config
# Place at ~/.config/zapusk/config.toml

# tld = "test"  # optional, defaults to "test" — used by init/doctor/add for DNS setup

[[projects]]
name = "myshop"
domain = "myshop.test"
port = 4000
type = "phoenix"
path = "/home/user/projects/myshop"
tls = true

[[projects]]
name = "company-site"
domain = "company.test"
port = 8001
type = "kirby"
php_version = "8.1"
path = "/home/user/projects/company-site"

[[projects]]
name = "blog"
domain = "blog.test"
port = 8002
type = "symfony"
path = "/home/user/projects/blog"

[[projects]]
name = "api"
domain = "api.test"
port = 3000
type = "axum"
path = "/home/user/projects/api"
upstream_host = "127.0.0.1" # optional reverse proxy target host

[caddy]
config_path = "/home/user/.config/zapusk/Caddyfile"
# caddy_bin = "caddy"  # optional, defaults to "caddy" in PATH

# Optional: configure what counts as web-ish ports for `u` -> `w` filter
[discovery]
web_ports = ["80", "443", "8080", "8443", "3000-9999"]

# Optional: hide noisy background listeners from discovery
# [[ignored_services]]
# port = 3306
# command = "mariadbd"

# Optional custom command override:
# command = "pnpm"
# args = ["dev", "--port", "5173"]
