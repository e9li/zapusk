# zapusk config
# Place at ~/.config/zapusk/config.toml
#
# Extra project types: drop a recipe in ~/.config/zapusk/frameworks/<id>.toml
# (see frameworks.example/ for rails, laravel, express) then set type = "<id>".

# language = "en"  # optional: en, de, fr, it, sr, ru — unset uses LANG; press `l` in the TUI to cycle

# tld = "test"  # optional, defaults to "test" — used by init/doctor/add for DNS setup

[[projects]]
name = "myshop"
domain = "myshop.test"
port = 4000
type = "phoenix"
path = "/home/user/projects/myshop"
tls = true

[[projects]]
name = "company-site"
domain = "company.test"
port = 8001
type = "kirby"
php_version = "8.1"
path = "/home/user/projects/company-site"

[[projects]]
name = "blog"
domain = "blog.test"
port = 8002
type = "symfony"
path = "/home/user/projects/blog"

[[projects]]
name = "api"
domain = "api.test"
port = 3000
type = "axum"
path = "/home/user/projects/api"
upstream_host = "127.0.0.1" # optional reverse proxy target host

# Docker-based project: zapusk runs `docker compose up` in the project dir.
# The compose file belongs to the project repo and should publish the
# configured port on localhost, e.g.  ports: ["${PORT}:80"]
[[projects]]
name = "shop"
domain = "shop.test"
port = 8080
type = "compose"
path = "/home/user/projects/shop"
tls = true
# compose_file = "docker-compose.dev.yml"  # optional, default: auto-detect
# service = "web"                          # optional: main service name
# compose_profiles = ["dev"]               # optional: --profile flags

[caddy]
config_path = "/home/user/.config/zapusk/Caddyfile"
# caddy_bin = "caddy"  # optional, defaults to "caddy" in PATH

# Optional: configure what counts as web-ish ports for `u` -> `w` filter
[discovery]
web_ports = ["80", "443", "8080", "8443", "3000-9999"]

# Optional: hide noisy background listeners from discovery
# [[ignored_services]]
# port = 3306
# command = "mariadbd"

# Optional custom command override:
# command = "pnpm"
# args = ["dev", "--port", "5173"]

# Color theme. `name` is groknight (default), terminal, nightfox, catppuccin,
# macintosh, macintosh-dark, or a file in ~/.config/zapusk/themes/<id>.toml.
# Remaining keys optionally override that theme. Values: #rrggbb, ANSI names
# (red, green, cyan, white, darkgray, …), or `reset` for the terminal default.
# [theme]
# name          = "groknight"
# bg            = "#141414"  # application canvas
# border        = "#414141"  # unfocused pane borders
# border_focus  = "#bb9af7"  # focused pane
# text          = "#e1e1e1"  # primary text
# text_dim      = "#6c6c6c"  # timestamps, labels, key hints
# accent        = "#bb9af7"  # titles, project type
# ok            = "#9ece6a"  # running status, managed badge
# warn          = "#e0af68"  # warnings, adopted badge, stderr
# err           = "#f7768e"  # errors, failed status
# highlight_bg  = "#242424"  # selected-item background
# highlight_fg  = "#e1e1e1"  # selected-item text (omit to use `text`)
