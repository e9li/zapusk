# zapusk config
# Place at ~/.config/zapusk/config.toml

# tld = "test"  # optional, defaults to "test" — used by init/doctor/add for DNS setup

[[projects]]
name = "myshop"
domain = "myshop.test"
port = 4000
type = "phoenix"
path = "/home/user/projects/myshop"
tls = true

[[projects]]
name = "company-site"
domain = "company.test"
port = 8001
type = "kirby"
php_version = "8.1"
path = "/home/user/projects/company-site"

[[projects]]
name = "blog"
domain = "blog.test"
port = 8002
type = "symfony"
path = "/home/user/projects/blog"

[[projects]]
name = "api"
domain = "api.test"
port = 3000
type = "axum"
path = "/home/user/projects/api"
upstream_host = "127.0.0.1" # optional reverse proxy target host

# Docker-based project: zapusk runs `docker compose up` in the project dir.
# The compose file belongs to the project repo and should publish the
# configured port on localhost, e.g.  ports: ["${PORT}:80"]
[[projects]]
name = "shop"
domain = "shop.test"
port = 8080
type = "compose"
path = "/home/user/projects/shop"
tls = true
# compose_file = "docker-compose.dev.yml"  # optional, default: auto-detect
# service = "web"                          # optional: main service name
# compose_profiles = ["dev"]               # optional: --profile flags

[caddy]
config_path = "/home/user/.config/zapusk/Caddyfile"
# caddy_bin = "caddy"  # optional, defaults to "caddy" in PATH

# Optional: configure what counts as web-ish ports for `u` -> `w` filter
[discovery]
web_ports = ["80", "443", "8080", "8443", "3000-9999"]

# Optional: hide noisy background listeners from discovery
# [[ignored_services]]
# port = 3306
# command = "mariadbd"

# Optional custom command override:
# command = "pnpm"
# args = ["dev", "--port", "5173"]

# Optional: override TUI colors. Values are hex strings (#rrggbb) or named
# terminal colors (red, green, cyan, white, darkgray, lightgreen, …).
# All fields are optional — omit to keep the default.
# [theme]
# border        = "#3c3c50"  # unfocused pane borders
# border_focus  = "#96c832"  # focused pane border (lime green)
# text          = "#c8c8d2"  # primary text
# text_dim      = "#646478"  # timestamps, labels, key hints
# accent        = "#78b4dc"  # project type, port numbers
# ok            = "#64c864"  # running status, managed badge
# warn          = "#dcb43c"  # warnings, adopted badge, stderr lines
# err           = "#dc5a5a"  # errors, failed status
# highlight_bg  = "#282837"  # selected-item background
